function home(){var complete=s.orders.filter(function(x){return x.status==='Concluída'}),active=s.orders.filter(function(x){return x.status!=='Concluída'&&x.status!=='Cancelada'});var total=complete.reduce(function(a,o){return a+service(o.service).price},0);return head('Bom dia! Seu negócio em ordem.','Seu painel de controle para serviços, cobranças e decisões melhores.','Nova ordem de serviço','ordem')+'<div class="alert"><b>Demonstração sem valor fiscal:</b> todos os clientes e documentos são fictícios. Os dados ficam apenas neste navegador. Não informe CPF, CNPJ ou dados reais.</div><div class="stats">'+stat('Ordens em aberto',active.length,'◷','Acompanhe os atendimentos')+stat('Receitas de OS concluídas',money(total),'↗','Soma ilustrativa, não conciliação bancária')+stat('Clientes cadastrados',s.clients.length,'♙','Base local de demonstração')+stat('Orçamentos pendentes',s.quotes.filter(function(x){return x.status==='Pendente'}).length,'▧','Aguardando aprovação')+'</div><div class="grid"><section class="panel"><div class="phead"><h2>Ordens recentes</h2><button class="linkbtn" data-goto="ordens">Ver todas →</button></div>'+table(['OS','CLIENTE / SERVIÇO','VALOR','STATUS'],orderRows(s.orders.slice().reverse().slice(0,4),false))+'</section><section class="panel"><div class="phead"><h2>Seus serviços</h2><button class="linkbtn" data-goto="servicos">Ver catálogo →</button></div>'+s.services.slice(0,5).map(function(x){return '<div class="item"><div class="bubble">⚒</div><div class="grow"><strong>'+esc(x.name)+'</strong><small>'+esc(x.category)+'</small></div><b>'+money(x.price)+'</b></div>'}).join('')+'</section></div><div class="banner"><div><h3>Tributação com a legislação ao lado.</h3><p>Simule o DAS do Simples Nacional usando o RBT12, consulte a parcela federal e municipal no regime e compare 2026 e 2027.</p></div><button class="btn" data-goto="tributos">Abrir simulador →</button></div>'}

function taxCalc(){var c=s.company,year=+c.year,rbt=+c.rbt,rev=+c.month;if(c.regime==='MEI'){return year===2026?{mei:true,total:86.05,detail:'DAS fixo do MEI de serviços: INSS R$ 81,05 + ISS R$ 5,00. Não incide por nota. Apuração mensal.'}:{err:'DAS-MEI de 2027 não foi confirmado nesta versão.'}}if(!['III','IV'].includes(c.regime))return {err:'Somente MEI e Simples Anexos III/IV estão implementados. Outros regimes exigem dados adicionais.'};if(![2026,2027].includes(year))return {err:'Vigência não suportada; selecione 2026 ou 2027.'};if(!(rbt>0)||rev<0)return {err:'Informe RBT12 positivo e receita mensal não negativa.'};if(rbt>3600000)return {err:'Receitas acima de R$ 3,6 milhões exigem regras específicas de sublimite/ISS fora do DAS. Cálculo bloqueado.'};var band=tables[c.regime].findIndex(function(x){return rbt<=x[0]});if(band<0)return {err:'Faixa não suportada'};var row=tables[c.regime][band],rate=(rbt*row[1]-row[2])/rbt,total=rev*rate;if(band>=4)return {total:total,rate:rate,band:band+1,warn:'A 5ª faixa pode sofrer teto e repartição especial do ISS. Exibimos somente o DAS estimado, sem desmembramento.'};var labels=shares[year+'-'+c.regime].map(function(x){return x[0]}),parts=byRange[year+'-'+c.regime][band];return {rate:rate,total:total,band:band+1,parts:parts.map(function(x,i){return {name:labels[i],value:total*x/100,share:x}})}}
function tax(){var c=s.company,r=taxCalc();var fields='<div class="fields"><label class="field"><span>Ano de competência</span><select class="input" data-field="year"><option value="2026" '+(+c.year===2026?'selected':'')+'>2026 — vigente</option><option value="2027" '+(+c.year===2027?'selected':'')+'>2027 — regras aprovadas</option></select></label><label class="field"><span>Regime / anexo confirmado pelo contador</span><select class="input" data-field="regime">'+[['III','Simples • Anexo III'],['IV','Simples • Anexo IV'],['MEI','MEI • somente serviços'],['outro','Outros regimes (bloqueado)']].map(function(x){return '<option value="'+x[0]+'" '+(c.regime===x[0]?'selected':'')+'>'+x[1]+'</option>'}).join('')+'</select></label><label class="field"><span>Município de referência</span><input class="input" value="'+esc(c.city)+'" disabled></label><label class="field"><span>Receita bruta dos 12 meses anteriores (RBT12)</span><input class="input" type="number" min="0.01" step="0.01" data-field="rbt" value="'+c.rbt+'"></label><label class="field"><span>Receita mensal sujeita ao anexo (R$)</span><input class="input" type="number" min="0" step="0.01" data-field="month" value="'+c.month+'"></label><label class="field"><span>Situação da empresa</span><input class="input" value="Empresa estabelecida • simulação" disabled></label></div>';
var content=r.err?'<div class="note orange"><b>Cálculo bloqueado:</b> '+esc(r.err)+'</div>':r.mei?'<div class="results"><div><small>DAS-MEI devido no mês em 2026</small><strong class="accent">'+money(r.total)+'</strong></div><div><small>INSS federal</small><strong>'+money(81.05)+'</strong></div><div><small>ISS fixo (municipal)</small><strong>'+money(5)+'</strong></div></div><div class="note">'+r.detail+'</div>':'<div class="results"><div><small>Alíquota efetiva do DAS</small><strong>'+pct(r.rate)+'</strong></div><div><small>DAS estimado sobre a receita do mês</small><strong class="accent">'+money(r.total)+'</strong></div><div><small>Faixa da LC 123/2006</small><strong>'+r.band+'ª faixa</strong></div></div>'+(r.parts?'<div class="breakdown">'+r.parts.map(function(p){return '<div><span>'+p.name+' • '+String(p.share).replace('.',',')+'% do DAS</span><strong>'+money(p.value)+'</strong></div>'}).join('')+'</div>':'')+(r.warn?'<div class="note orange">'+r.warn+'</div>':'')+'<div class="note">As parcelas de ISS e, em 2027, de CBS/IBS mostradas acima são <b>componentes do DAS</b>, não impostos extras somados ao DAS. No Anexo IV, a CPP patronal é apurada <b>fora do DAS</b> e não está incluída na conta.</div>';
return head('Central tributária','Tabelas legais de 2026 e 2027 • Simples Nacional e MEI, com vigência e limites explícitos.')+'<div class="alert"><b>Atenção:</b> simulador de apoio, não substitui o PGDAS-D, a legislação específica, o contador ou o emissor da NFS-e. O anexo depende da natureza real da atividade/CNAE; RBT12 de empresa em início de atividade requer regra própria. Não utilize estes números para recolher tributos sem validação profissional.</div><div class="panel"><div class="phead"><h2>Simulação legal do DAS</h2><span class="badge info">Lei Complementar 123/2006 e 227/2026</span></div>'+fields+content+'<div class="note orange"><b>São Paulo:</b> em serviço sujeito ao ISS, a alíquota municipal fora do Simples varia segundo município e código do serviço; não existe uma única alíquota estadual paulista de ISS. O ICMS não é automaticamente devido em serviço típico sujeito ao ISS. A demonstração não presume alíquota municipal de Teodoro Sampaio nem aplica IBS por fora do Simples.</div></div><div class="grid" style="margin-top:18px"><div class="panel"><div class="phead"><h2>Reforma do consumo</h2></div><div class="item"><div class="bubble">26</div><div><strong>2026 • ano de teste</strong><small>Para optantes do Simples, a exigência de CBS/IBS nas notas começa em 2027; não adicionamos os 0,9% e 0,1% ao DAS.</small></div></div><div class="item"><div class="bubble">27</div><div><strong>2027 • CBS e IBS no Simples</strong><small>As parcelas são repartidas dentro do DAS, conforme as tabelas específicas vigentes em 2027.</small></div></div><div class="item"><div class="bubble">NF</div><div><strong>NFS-e Nacional</strong><small>ME/EPP do Simples usam o emissor nacional desde 01/11/2026; aqui não emitimos notas fiscais.</small></div></div></div><div class="panel"><h2>Fontes auditáveis</h2><div class="sources"><a target="_blank" rel="noopener" href="https://legis.senado.gov.br/norma/572878/publicacao/34621013">Lei Complementar 123 — anexos III e IV (2026)</a><a target="_blank" rel="noopener" href="https://legis.senado.gov.br/norma/40180341/publicacao/40181117">LC 227 — Anexo III (2027–28)</a><a target="_blank" rel="noopener" href="https://legis.senado.gov.br/norma/40180341/publicacao/40181123">LC 227 — Anexo IV (2027–28)</a><a target="_blank" rel="noopener" href="https://www8.receita.fazenda.gov.br/simplesnacional/Noticias/NoticiaCompleta.aspx?id=c3b2044c-ff97-432a-b33c-ecf2a3df6dc3">Receita Federal — DAS-MEI 2026</a><a target="_blank" rel="noopener" href="https://www.gov.br/receitafederal/pt-br/assuntos/noticias/2026/agosto/simples-nacional-nfs-e-nacional-sera-obrigatoria-para-me-e-epp-a-partir-de-1o-de-novembro-de-2026">Receita Federal — NFS-e novembro de 2026</a><a target="_blank" rel="noopener" href="https://www.gov.br/nfse/pt-br/biblioteca/documentacao-tecnica/documentacao-atual">Documentação oficial NFS-e</a></div></div></div>'}
function settings(){return head('Configurações da demonstração','Perfil da empresa fictícia e informação técnica do projeto.')+'<div class="grid"><div class="panel"><h2>Empresa demonstrativa</h2><div class="fields" style="grid-template-columns:1fr"><label class="field"><span>Razão de exibição</span><input class="input" value="'+esc(s.company.name)+'" disabled></label><label class="field"><span>Localidade</span><input class="input" value="'+esc(s.company.city)+'" disabled></label></div><button class="btn ghost" id="resetDemo">Restaurar dados fictícios</button></div><div class="panel"><h2>Infraestrutura</h2><div class="item"><div class="bubble">✓</div><div><strong>Interface online • Vercel</strong><small>Ambiente de avaliação pessoal, sem finalidade comercial.</small></div></div><div class="item"><div class="bubble">⌁</div><div><strong>Repositório GitHub</strong><small>Código versionado em branch independente.</small></div></div><div class="item"><div class="bubble">○</div><div><strong>Supabase • pendente</strong><small>Aguardando confirmação exigida para criar o projeto. Nenhum dado enviado ao banco.</small></div></div></div></div>'}
function page(){var views={painel:home,clientes:clients,servicos:services,ordens:orders,orcamentos:quotes,tributos:tax,ajustes:settings};document.getElementById('content').innerHTML=(views[view]||home)()+'<footer class="foot"><span>Prestador 360 · Prévia técnica não comercial · 06/11/2026</span><span>Dados fictícios • Sem NFS-e • Sem integração fiscal de produção</span></footer>';bind()}
function render(){layout()}
function bind(){document.querySelectorAll('[data-modal]').forEach(function(b){b.onclick=function(){openModal(b.dataset.modal)}});document.querySelectorAll('[data-goto]').forEach(function(b){b.onclick=function(){view=b.dataset.goto;render()}});document.querySelectorAll('[data-order]').forEach(function(b){b.onchange=function(){var o=s.orders.find(function(x){return x.id===+b.dataset.order});if(o){o.status=b.value;save();page()}}});document.querySelectorAll('[data-print]').forEach(function(b){b.onclick=function(){printQuote(+b.dataset.print)}});document.querySelectorAll('[data-field]').forEach(function(i){i.onchange=function(){s.company[i.dataset.field]=i.dataset.field==='year'||i.dataset.field==='rbt'||i.dataset.field==='month'?Number(i.value):i.value;save();page()}});var reset=document.getElementById('resetDemo');if(reset)reset.onclick=function(){if(confirm('Restaurar apenas os dados fictícios desta demonstração?')){s=JSON.parse(JSON.stringify(seed));save();render()}}}
function openModal(kind){modal=kind;var title={cliente:'Novo cliente',servico:'Novo serviço',ordem:'Nova ordem de serviço',orcamento:'Novo orçamento'}[kind];var customerOptions=s.clients.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join('');var serviceOptions=s.services.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+' — '+money(c.price)+'</option>'}).join('');var body=kind==='cliente'?'<label class="field"><span>Nome</span><input class="input" name="name" required maxlength="100"></label><label class="field"><span>Telefone</span><input class="input" name="phone" maxlength="30"></label><label class="field"><span>Cidade</span><input class="input" name="city" value="Teodoro Sampaio" maxlength="100"></label>':kind==='servico'?'<label class="field"><span>Nome do serviço</span><input class="input" name="name" required maxlength="100"></label><label class="field"><span>Categoria</span><input class="input" name="category" required maxlength="60"></label><label class="field"><span>Preço base (R$)</span><input class="input" name="price" type="number" min="0" step="0.01" required></label>':'<label class="field"><span>Cliente</span><select class="input" name="client" required>'+customerOptions+'</select></label><label class="field"><span>Serviço</span><select class="input" name="service" required>'+serviceOptions+'</select></label>'+(kind==='ordem'?'<label class="field"><span>Data do atendimento</span><input class="input" name="date" type="date" value="2026-11-06" required></label>':'');
var layer=document.createElement('div');layer.className='overlay';layer.id='modal';layer.innerHTML='<div class="modal"><div class="modal-header"><h2>'+title+'</h2><button class="close" id="close">×</button></div><form id="form" class="formrow">'+body+'<div class="modal-actions"><button type="button" class="btn ghost" id="cancel">Cancelar</button><button class="btn" type="submit">Salvar</button></div></form></div>';document.body.appendChild(layer);layer.querySelector('#close').onclick=closeModal;layer.querySelector('#cancel').onclick=closeModal;layer.addEventListener('click',function(e){if(e.target===layer)closeModal()});layer.querySelector('#form').onsubmit=function(e){e.preventDefault();var d=Object.fromEntries(new FormData(e.target).entries()),id=Date.now();if(kind==='cliente')s.clients.push({id:id,name:d.name,phone:d.phone,city:d.city});if(kind==='servico')s.services.push({id:id,name:d.name,price:Number(d.price),category:d.category});if(kind==='ordem')s.orders.push({id:id,client:Number(d.client),service:Number(d.service),date:d.date,status:'Agendada'});if(kind==='orcamento')s.quotes.push({id:id,client:Number(d.client),service:Number(d.service),status:'Pendente'});save();closeModal();render()}}
function closeModal(){var d=document.getElementById('modal');if(d)d.remove()}
function printQuote(id){var q=s.quotes.find(function(x){return x.id===id});if(!q)return;var html='<html><head><meta charset="utf-8"><title>Orçamento '+q.id+'</title><style>body{font:15px Arial;padding:50px;color:#203247}h1{color:#078c7d}.box{border:1px solid #ddd;padding:20px;border-radius:12px;margin:25px 0}small{color:#a60}</style></head><body><h1>'+esc(s.company.name)+'</h1><h2>Orçamento comercial #'+q.id+'</h2><small>DOCUMENTO NÃO FISCAL — DADOS DE DEMONSTRAÇÃO</small><div class="box"><p><b>Cliente:</b> '+esc(client(q.client).name)+'</p><p><b>Serviço:</b> '+esc(service(q.service).name)+'</p><h2>Total: '+money(service(q.service).price)+'</h2></div><p>Este documento não é NFS-e, não discrimina tributos nem comprova recolhimento.</p></body></html>';var w=window.open('','_blank');if(!w){alert('Permita a abertura de janelas para imprimir.');return}w.document.write(html);w.document.close();w.focus();setTimeout(function(){w.print()},350)}
render();
})();
