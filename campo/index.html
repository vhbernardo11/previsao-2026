<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6b58"><title>ESF-06 Campo</title>
<style>
:root{--p:#0b6b58;--bg:#f4f7f6;--c:#fff;--t:#17332d;--m:#65756f;--l:#dbe6e2}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t)}
header{position:sticky;top:0;z-index:10;background:#f4f7f6ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--l);padding:12px 14px}
.wrap{max-width:900px;margin:auto;padding:12px 12px 96px}.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand h1{font-size:20px;margin:0}.small{font-size:12px;color:var(--m)}
.card,.street,.house,.stat{background:var(--c);border:1px solid var(--l);border-radius:16px}.card{padding:14px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}.stat{padding:12px}.stat b{display:block;font-size:25px}
input,textarea,select{width:100%;padding:12px;border-radius:11px;border:1px solid #cbd8d4;background:#fff;font:inherit;color:var(--t)}
button{font:inherit;font-weight:700;border:0;border-radius:11px;padding:11px 12px}.pri{background:var(--p);color:#fff}.soft{background:#e4f3ef;color:#075545}.ghost{background:#fff;border:1px solid var(--l)}
.list{display:grid;gap:9px;margin-top:10px}.street,.house{padding:13px}.street h3,.house h3{margin:0;font-size:17px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.badge{font-size:11px;padding:5px 8px;border-radius:99px;font-weight:800;background:#eee}.nao_visitado{background:#ecefee}.mesma_familia{background:#def3e7;color:#1e6b3c}.mudou,.outra_familia{background:#fff0d4;color:#7e5400}.imovel_vazio,.nao_encontrado,.recusou{background:#fde1e1;color:#8f2525}.voltar_depois{background:#e7e7ff;color:#42428a}
.progress{height:8px;background:#e8efec;border-radius:99px;overflow:hidden;margin-top:8px}.progress>span{display:block;height:100%;background:var(--p)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.full{grid-column:1/-1}label{font-size:13px;font-weight:700}label input,label textarea{margin-top:5px}
dialog{border:0;border-radius:18px;padding:0;width:min(760px,96vw);max-height:93vh;color:var(--t)}dialog::backdrop{background:#0008}.modal{padding:14px 14px 90px;overflow:auto;max-height:93vh}.modal h2{margin:0}.modal h3{border-top:1px solid var(--l);padding-top:13px;margin:16px 0 8px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:7px}.tog{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:5px}.tog button{padding:9px 4px;background:#edf1ef;color:#53625d}.tog .yes{background:#dff2e6;color:#165d34}.tog .no{background:#ecefef}.tog .unk{background:#fff0d8;color:#835000}
.savebar{position:fixed;bottom:0;left:0;right:0;background:#fffef;border-top:1px solid var(--l);padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:none;gap:8px;z-index:20}.savebar button:first-child{flex:1}
.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#172622;color:#fff;padding:9px 13px;border-radius:99px;display:none;z-index:30}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
</style></head><body>
<header id="hdr" hidden><div class="brand"><div><h1>ESF-06 · Recadastramento de Campo</h1><div class="small">Rua por rua · endereço por endereço</div></div><button id="logout" class="ghost">Sair</button></div></header>
<main class="wrap">
<section id="login" class="card" style="max-width:430px;margin:40px auto"><h2 style="margin:0">Acesso</h2><p class="small">Digite o código do recadastramento.</p><input id="access" type="password" placeholder="Código de acesso"><button id="enter" class="pri" style="width:100%;margin-top:8px">Entrar</button></section>
<section id="app" hidden>
<div class="stats"><div class="stat"><span class="small">Famílias</span><b id="st">0</b></div><div class="stat"><span class="small">Não visitadas</span><b id="sn">0</b></div><div class="stat"><span class="small">Concluídas</span><b id="sc">0</b></div><div class="stat"><span class="small">Voltar depois</span><b id="sv">0</b></div></div>
<div class="card"><input id="search" placeholder="Buscar rua, nº, responsável ou família..."></div>
<div id="streets" class="list"></div><div id="houses" class="list" hidden></div>
</section></main>

<dialog id="dlg"><div class="modal">
<div class="row"><div><h2 id="dn"></h2><div class="small" id="dc"></div></div><button id="close" class="ghost">Fechar</button></div>
<h3>Situação do domicílio</h3><div class="choices" id="statusChoices"></div>
<div id="sameBlock" hidden>
<h3>Confirmar família atual</h3><div class="grid">
<label class="full">Responsável atual<input id="resp"></label><label>Moradores<input id="members" type="number" min="0"></label><label>Data da visita<input id="date" type="date"></label>
<label>Cômodos<input id="rooms" type="number" min="1"></label><label>Distância da unidade (km)<input id="dist" type="number" min="0" step="0.1"></label>
</div><h3>Condições e vulnerabilidades</h3><div id="bools"></div></div>
<div id="otherBlock" hidden><h3>Nova família encontrada</h3><div class="grid"><label class="full">Responsável<input id="newResp"></label><label>Moradores<input id="newMembers" type="number" min="0"></label><label class="full">Observações<textarea id="newNotes" rows="3"></textarea></label></div></div>
<h3>Observação da visita</h3><textarea id="visitNotes" rows="3"></textarea>
</div></dialog>
<div class="savebar" id="savebar"><button class="pri" id="save">Salvar visita</button><button class="ghost" id="cancel">Cancelar</button></div>
<div class="toast" id="toast"></div>

<script>
const SUPA='https://pvwqxpqetdxtmqqypqjk.supabase.co';
const KEY='sb_publishable_WwKpO5d-LZzh3vgOF1dJOg_rMO7UHgF';
const BOOLS=[['acamado','Acamado'],['deficiencia','Deficiência'],['transtorno_mental_alto_risco','Transtorno mental de alto risco'],['deficiencia_intelectual','Deficiência intelectual'],['saneamento_ruim','Saneamento inadequado'],['desnutricao','Desnutrição'],['abuso_substancia_psicoativa','Uso de substância psicoativa'],['adulto_sem_renda','Adulto sem renda'],['analfabetismo','Analfabetismo'],['menor_2_anos','Menor de 2 anos'],['maior_60_anos','Maior de 60 anos'],['hipertensao','Hipertensão'],['diabetes','Diabetes'],['hemodialise','Hemodiálise'],['gestante','Gestante'],['povos_originarios','Povos originários'],['doencas_transmissiveis','Doenças transmissíveis'],['problema_respiratorio','Problema respiratório com medicamento'],['lgbt','População LGBT'],['cancer','Câncer']];
const LABELS={nao_visitado:'Não visitado',mesma_familia:'Mesma família',mudou:'Mudou',outra_familia:'Outra família',imovel_vazio:'Imóvel vazio',nao_encontrado:'Não encontrado',recusou:'Recusou',voltar_depois:'Voltar depois'};
let access=localStorage.getItem('esf06_access')||'',overview=null,currentStreet=null,current=null,draftStatus='nao_visitado',draftB={};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}
async function rpc(action,payload={}){const r=await fetch(SUPA+'/rest/v1/rpc/esf06_campo_api',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({p_action:action,p_key:access,p_payload:payload})});let j;try{j=await r.json()}catch{throw Error('Resposta inválida do servidor')};if(!r.ok)throw Error(j.message||j.error||'Falha');return j}
function badge(s){return '<span class="badge '+esc(s)+'">'+esc(LABELS[s]||s)+'</span>'}
async function load(){overview=await rpc('overview');renderStreets()}
function renderStreets(){const q=$('search').value.trim().toLowerCase();$('st').textContent=overview.summary.total;$('sn').textContent=overview.summary.nao_visitado;$('sc').textContent=overview.summary.concluidas;$('sv').textContent=overview.summary.voltar_depois;$('houses').hidden=true;$('streets').hidden=false;const arr=overview.streets.filter(s=>!q||s.street.toLowerCase().includes(q));$('streets').innerHTML=arr.map(s=>{const done=s.total-s.nao_visitado,pct=s.total?Math.round(done*100/s.total):0;return '<article class="street"><div class="row"><div><h3>'+esc(s.street)+'</h3><div class="small">'+s.total+' endereço(s) · '+s.nao_visitado+' não visitado(s)</div></div><button class="soft openStreet" data-s="'+encodeURIComponent(s.street)+'">Abrir rua</button></div><div class="progress"><span style="width:'+pct+'%"></span></div><div class="small" style="margin-top:5px">'+pct+'% percorrido</div></article>'}).join('');document.querySelectorAll('.openStreet').forEach(b=>b.onclick=()=>openStreet(decodeURIComponent(b.dataset.s)))}
async function openStreet(street){currentStreet=await rpc('street',{street});$('streets').hidden=true;$('houses').hidden=false;renderHouses()}
function renderHouses(){const q=$('search').value.trim().toLowerCase();const rows=currentStreet.rows.filter(x=>!q||[x.number,x.responsible_name,x.family_code].join(' ').toLowerCase().includes(q));$('houses').innerHTML='<button class="ghost" id="back">← Voltar às ruas</button>'+rows.map(x=>'<article class="house"><div class="row"><div><h3>Nº '+esc(x.number||'s/n')+' · '+esc(x.responsible_name||'Sem responsável')+'</h3><div class="small">'+esc(x.family_code)+' · '+esc(x.member_count??'—')+' morador(es)</div></div>'+badge(x.visit_status)+'</div><div class="small">'+esc([x.street,x.number,x.reference,x.neighborhood].filter(Boolean).join(', '))+'</div><button class="soft openHouse" data-id="'+x.id+'" style="margin-top:8px">Abrir domicílio</button></article>').join('');$('back').onclick=()=>{currentStreet=null;$('search').value='';renderStreets()};document.querySelectorAll('.openHouse').forEach(b=>b.onclick=()=>openHouse(b.dataset.id))}
function setToggle(k,v){const e=document.querySelector('.tog[data-f="'+k+'"]');if(!e)return;e.querySelectorAll('button').forEach(b=>{b.className='';const x=b.dataset.v==='t'?true:b.dataset.v==='f'?false:null;if(x===v)b.className=v===true?'yes':v===false?'no':'unk'})}
function setStatus(s){draftStatus=s;document.querySelectorAll('#statusChoices button').forEach(b=>b.classList.toggle('pri',b.dataset.s===s));$('sameBlock').hidden=s!=='mesma_familia';$('otherBlock').hidden=s!=='outra_familia'}
async function openHouse(id){const j=await rpc('family',{id});current=j;draftStatus=j.visit.visit_status||'nao_visitado';draftB={...(j.recadastro||{})};$('dn').textContent='Nº '+(j.family.number||'s/n')+' · '+(j.family.responsible_name||'Sem responsável');$('dc').textContent=(j.family.street||'')+' · Família '+j.family.family_code;$('resp').value=j.family.responsible_name||'';$('members').value=j.recadastro.moradores??j.family.member_count??'';$('date').value=j.recadastro.data_recadastramento??new Date().toISOString().slice(0,10);$('rooms').value=j.recadastro.comodos??'';$('dist').value=j.recadastro.distancia_km??'';$('visitNotes').value=j.visit.notes??'';$('newResp').value=j.visit.current_responsible_name??'';$('newMembers').value=j.visit.current_member_count??'';$('newNotes').value='';
$('statusChoices').innerHTML=Object.entries(LABELS).filter(([k])=>k!=='nao_visitado').map(([k,v])=>'<button class="ghost" data-s="'+k+'">'+v+'</button>').join('');document.querySelectorAll('#statusChoices button').forEach(b=>b.onclick=()=>setStatus(b.dataset.s));$('bools').innerHTML=BOOLS.map(([k,l])=>'<div style="margin:10px 0"><label>'+esc(l)+'</label><div class="tog" data-f="'+k+'"><button data-v="t">Sim</button><button data-v="f">Não</button><button data-v="n">Não confirmado</button></div></div>').join('');BOOLS.forEach(([k])=>setToggle(k,j.recadastro[k]??null));document.querySelectorAll('.tog button').forEach(b=>b.onclick=()=>{const f=b.parentElement.dataset.f,v=b.dataset.v==='t'?true:b.dataset.v==='f'?false:null;draftB[f]=v;setToggle(f,v)});setStatus(draftStatus);$('dlg').showModal();$('savebar').style.display='flex'}
function closeDlg(){$('dlg').close();$('savebar').style.display='none';current=null}
async function save(){if(!current)return;const rec={};BOOLS.forEach(([k])=>rec[k]=(k in draftB)?draftB[k]:null);rec.moradores=$('members').value===''?null:Number($('members').value);rec.data_recadastramento=$('date').value||null;rec.comodos=$('rooms').value===''?null:Number($('rooms').value);rec.distancia_km=$('dist').value===''?null:Number($('dist').value);const payload={family_id:current.family.id,status:draftStatus,notes:$('visitNotes').value,current_responsible_name:draftStatus==='outra_familia'?$('newResp').value:$('resp').value,current_member_count:draftStatus==='outra_familia'?($('newMembers').value===''?null:Number($('newMembers').value)):rec.moradores,recadastro:rec,new_family:draftStatus==='outra_familia'?{responsible_name:$('newResp').value,member_count:$('newMembers').value===''?null:Number($('newMembers').value),notes:$('newNotes').value}:null};$('save').disabled=true;$('save').textContent='Salvando…';try{await rpc('save',payload);toast('Visita salva');closeDlg();overview=await rpc('overview');await openStreet(currentStreet.street)}catch(e){toast(e.message)}finally{$('save').disabled=false;$('save').textContent='Salvar visita'}}
async function enter(){access=$('access').value.trim();if(!access)return toast('Digite o código');try{await load();localStorage.setItem('esf06_access',access);$('login').hidden=true;$('app').hidden=false;$('hdr').hidden=false}catch(e){toast(e.message)}}
$('enter').onclick=enter;$('access').onkeydown=e=>{if(e.key==='Enter')enter()};$('logout').onclick=()=>{localStorage.removeItem('esf06_access');location.reload()};$('search').oninput=()=>currentStreet?renderHouses():renderStreets();$('close').onclick=$('cancel').onclick=closeDlg;$('save').onclick=save;if(access){$('access').value=access;enter()}
</script></body></html>
